<div class="page-header">
    <div class="row">
        <div class="col-md-8">
            <h2>{{::vm.translate.get('Tax Classes')}}</h2>
        </div>
        <div class="col-md-4 text-right">
            <a ui-sref="tax-classes-create" class="btn btn-primary"><span class="glyphicon glyphicon-plus"></span> {{::vm.translate.get('Create Tax Class')}}</a>
        </div>
    </div>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>{{::vm.translate.get('Name')}}</th>
            <th>{{::vm.translate.get('Actions')}}</th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="taxClass in vm.taxClasses">
            <td>{{taxClass.name}}</td>
            <td class="text-center">
                <div class="dropdown" style="display:inline-block">
                    <button class="btn btn-default btn-xs dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="fa fa-cog"></i> <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-right">
                        <li>
                            <a ui-sref="tax-classes-edit({id: taxClass.id})">
                                <span class="glyphicon glyphicon-pencil"></span> {{::vm.translate.get('Edit')}}
                            </a>
                        </li>
                        <li role="separator" class="divider"></li>
                        <li>
                            <a href ng-click="vm.deleteTaxClass(taxClass)" style="color:#c0392b">
                                <span class="glyphicon glyphicon-remove"></span> {{::vm.translate.get('Delete')}}
                            </a>
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
    </tbody>
</table>

<div class="page-header">
    <div class="row">
        <div class="col-md-8">
            <h2>News Category List</h2>
        </div>
        <div class="col-md-4 text-right">
            <a ui-sref="news-categories-create" class="btn btn-primary"><span class="glyphicon glyphicon-plus"></span> Create News Category</a>
        </div>
    </div>
</div>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Name</th>
        <th class="text-center">Is Published</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr ng-repeat="newsCategory in vm.newsCategorys">
        <td>{{newsCategory.name}}</td>
        <td class="text-center"><i ng-attr-class="{{newsCategory.isPublished && 'fa fa-circle' || 'fa fa-circle-o'}}"></i></td>
        <td class="text-center">
            <div class="dropdown" style="display:inline-block">
                <button class="btn btn-default btn-xs dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i class="fa fa-cog"></i> <span class="caret"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-right">
                    <li>
                        <a ui-sref="news-categories-edit({id: newsCategory.id})">
                            <span class="glyphicon glyphicon-pencil"></span> Edit
                        </a>
                    </li>
                    <li role="separator" class="divider"></li>
                    <li>
                        <a href ng-click="vm.deleteNewsCategory(newsCategory)" style="color:#c0392b">
                            <span class="glyphicon glyphicon-remove"></span> Delete
                        </a>
                    </li>
                </ul>
            </div>
        </td>
    </tr>
    </tbody>
</table>

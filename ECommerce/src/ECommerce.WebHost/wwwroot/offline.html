<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invenzo</title>
    <style>
        body {
            align-items: center;
            background: #f4f8f5;
            color: #1f2933;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        main {
            background: #fff;
            border: 1px solid #dfe8e2;
            border-radius: 8px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
            max-width: 460px;
            padding: 28px;
            text-align: center;
        }

        h1 {
            color: #166534;
            font-size: 28px;
            margin: 0 0 12px;
        }

        p {
            color: #526173;
            line-height: 1.5;
            margin: 0 0 18px;
        }

        button {
            background: #16a34a;
            border: 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 10px 18px;
        }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>The storefront could not reach the network. Check your connection and try again.</p>
        <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
</body>
</html>
